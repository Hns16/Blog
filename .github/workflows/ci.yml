name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Architecture check
        run: npm run check:architecture

      - name: State structure check
        run: npm run check:state

      - name: Publishing branch check
        run: npm run check:publishing

      - name: Admin health shape check
        run: npm run check:admin-health

      - name: Admin diag shape check
        run: npm run check:admin-diag

      - name: Content permissions check
        run: npm run check:content-permissions

      - name: Routes meta check
        run: npm run check:routes-meta

      - name: Admin route meta usage check
        run: npm run check:admin-route-meta-usage

      - name: Publish scheduled HTML check
        run: npm run check:publish-scheduled-html

      - name: Publish scheduled zero check
        run: npm run check:publish-scheduled-zero

      - name: Route guard check
        run: npm run check:route-guard

      - name: Env config check
        run: npm run check:env

      - name: Audit file check
        run: npm run check:audit-file

      - name: Todo consistency check
        run: npm run check:todo-consistency

      - name: Admin UI telemetry check
        run: npm run check:admin-ui-telemetry

      - name: Admin i18n coverage check
        run: npm run check:admin-i18n-coverage

      - name: Admin redirect rid check
        run: npm run check:admin-redirect-rid

      - name: Request id presence check
        run: npm run check:request-id-presence

      - name: Docs links check
        run: npm run check:docs-links

      - name: API error codes check
        run: npm run check:api-error-codes

      - name: Runbook commands check
        run: npm run check:runbook-commands

      - name: Runbook matrix sync check
        run: npm run check:runbook-matrix-sync

      - name: CI steps order check
        run: npm run check:ci-steps-order

      - name: Smoke step order check
        run: npm run check:smoke-step-order

      - name: API route count check
        run: npm run check:api-route-count

      - name: Audit action coverage check
        run: npm run check:audit-action-coverage

      - name: Docs toc check
        run: npm run check:docs-toc

      - name: Script shebang check
        run: npm run check:script-shebang

      - name: JSON output check
        run: npm run check:json-output

      - name: Admin pages params check
        run: npm run check:admin-pages-params

      - name: Smoke report schema check
        run: npm run check:smoke-report-schema

      - name: Doc command sync check
        run: npm run check:doc-command-sync

      - name: Admin health fields check
        run: npm run check:admin-health-fields

      - name: Output artifacts check
        run: npm run check:output-artifacts

      - name: Admin page links check
        run: npm run check:admin-page-links

      - name: Docs version stamp check
        run: npm run check:docs-version-stamp

      - name: Release checklist coverage check
        run: npm run check:release-checklist-coverage

      - name: Health shape runtime check
        run: npm run check:health-shape-runtime

      - name: Diag shape runtime check
        run: npm run check:diag-shape-runtime

      - name: API boundary drill
        run: npm run drill:api

      - name: Release drill
        run: npm run drill:release
